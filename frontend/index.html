<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" id="meta-theme" />
    <!--
      Apply the persisted or system-preferred theme before React mounts so the
      first paint is never the wrong colour scheme (no flash of the default).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("shortlink.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          var meta = document.getElementById("meta-theme");
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0c" : "#f7f7f9");
        } catch (e) {
          /* ignore — fall back to default theme */
        }
      })();
    </script>
    <meta
      name="description"
      content="SHORT//LINK — a simple, fast URL shortener with click analytics. Shorten long links and share with confidence."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>SHORT//LINK — Simple links. Powerful analytics.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
